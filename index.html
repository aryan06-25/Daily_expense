<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Kharcha Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: left rail + one working column on desktop; bottom tab bar on phones.
   Palette: cool slate neutrals, one indigo accent for "this month", a muted slate for "last month",
   amber/green only for more/less spending. Type: Space Grotesk for numbers and titles, Inter for text. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface2:#eceef4; --fg:#141721;
  --muted:#5a6073; --line:#e0e3ec; --accent:#4f46e5; --accent-fg:#ffffff; --accent-soft:#e7e6fb;
  --prev:#98a1b6; --good:#0d7d56; --good-soft:#dcf3e9; --warn:#a8470f; --warn-soft:#fbe9db;
  --font-d:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1017; --surface:#171a24; --surface2:#1f2331; --fg:#eceef6; --muted:#9aa2b8; --line:#2a2f42;
    --accent:#8e89ff; --accent-fg:#0e1017; --accent-soft:#272850; --prev:#6c7592;
    --good:#4cc79a; --good-soft:#15332a; --warn:#f2a56e; --warn-soft:#3a2616; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1017; --surface:#171a24; --surface2:#1f2331; --fg:#eceef6; --muted:#9aa2b8; --line:#2a2f42;
  --accent:#8e89ff; --accent-fg:#0e1017; --accent-soft:#272850; --prev:#6c7592;
  --good:#4cc79a; --good-soft:#15332a; --warn:#f2a56e; --warn-soft:#3a2616; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:14px/1.5 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 100px;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:36px;max-width:1120px;margin:0 auto}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:28px;min-height:calc(100vh - 80px)}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:700 18px var(--font-d)}
.brand b{display:block;font:700 17px var(--font-d);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.sidenav{display:flex;flex-direction:column;gap:4px}
.sidenav a{padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.sidenav a:hover{background:var(--surface2);color:var(--fg)}
.sidenav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.sidefoot{margin-top:auto;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
main{min-width:0}
.top{display:flex;flex-wrap:wrap;gap:14px 20px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.eyebrow{margin:0 0 2px;color:var(--muted);font-size:13px}
h1{margin:0;font:700 32px/1.1 var(--font-d);letter-spacing:-.02em;text-wrap:balance}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.monthnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.monthnav button{background:none;border:0;width:38px;height:38px;border-radius:12px;font-size:18px;color:var(--muted)}
.monthnav button:hover:not(:disabled){color:var(--fg);background:var(--surface2)}
.monthnav button:disabled{opacity:.35;cursor:default}
.monthnav span{min-width:128px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13px}
.notice:empty{display:none}
.notice button{background:none;border:0;color:var(--accent);font-weight:600;padding:0}
.grid{display:grid;gap:16px}
.g-top{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.card h2{margin:0;font:600 16px var(--font-d)}
.card .hint{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.label{margin:0;color:var(--muted);font-size:13px}
.big{margin:4px 0 0;font:700 clamp(32px,6vw,46px)/1.1 var(--font-d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.count .big{font-size:clamp(32px,6vw,46px)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 16px;margin-bottom:14px}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill.up{background:var(--warn-soft);color:var(--warn)}
.pill.down{background:var(--good-soft);color:var(--good)}
.pill.flat{background:var(--surface2);color:var(--muted)}
.cmp{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:14px 0 0}
.cmp p{margin:0;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px;border-radius:2px}
.legend i.p{border-top:2px dashed var(--prev)}
.legend b{color:var(--fg);font-variant-numeric:tabular-nums}
#linechart{width:100%}
#linechart svg{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1;fill:none}
.tk{fill:var(--muted);font:11px var(--font-b)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.cname{font-weight:600;overflow-wrap:anywhere}
.cname span{color:var(--muted);font-weight:400;margin-left:6px;font-size:12.5px}
.camt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.camt span{display:block;color:var(--muted);font-weight:400;font-size:12px}
.cbars{grid-column:1 / -1;display:grid;gap:4px}
.bar{height:7px;border-radius:4px;background:var(--accent);min-width:3px}
.bar.p{background:var(--prev);height:5px;opacity:.85}
.bar.zero{opacity:.25}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rmain{min-width:0}
.rdesc{display:block;font-weight:600;overflow-wrap:anywhere}
.rmeta{display:block;color:var(--muted);font-size:12.5px}
.ramt{font:600 15px var(--font-d);font-variant-numeric:tabular-nums}
.del{background:none;border:1px solid transparent;color:var(--muted);border-radius:8px;min-width:34px;height:34px;padding:0 8px;font-size:13px}
.del:hover{border-color:var(--line);color:var(--fg)}
.del.armed{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600}
.link{color:var(--accent);font-weight:600;font-size:13px}
.empty{color:var(--muted);margin:6px 0 0}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=password],input[type=date],input[type=search],input[inputmode]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--fg)}
.inline{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.inline input{flex:1 1 180px;width:auto}
.err{color:var(--warn);font-size:13px;min-height:18px;margin:0 0 6px}
.overlay{position:fixed;inset:0;background:rgba(8,10,18,.55);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:30}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:420px}
.sheet h2{margin:0 0 14px;font:700 20px var(--font-d)}
.sheet .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.toast:empty{display:none}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));grid-template-columns:repeat(4,1fr);gap:6px;z-index:20}
.tabbar a,.tabbar button{border:0;background:none;border-radius:10px;padding:10px 4px;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.tabbar a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tabbar .addtab{background:var(--accent);color:var(--accent-fg)}
@media (max-width:859px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .tabbar{display:grid}
  .add-top{display:none}
  h1{font-size:28px}
  .g-top{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px}
}
.authwrap{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:60;overflow:auto}
.authwrap .sheet{max-width:380px}
.authwrap .brand{margin-bottom:18px}
.authwrap .swap{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0 0;width:100%;text-align:center}
.authwrap .fine{color:var(--muted);font-size:12px;margin:12px 0 0}
@media (prefers-reduced-motion:no-preference){.btn,.sidenav a,.del{transition:background .15s,color .15s,border-color .15s}}
</style>
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brand"><span class="mark">₹</span><div><b>Kharcha</b><small>Personal finance</small></div></div>
    <nav class="sidenav" aria-label="Main">
      <a href="#dashboard" data-route="dashboard">Dashboard</a>
      <a href="#expenses" data-route="expenses">Expenses</a>
      <a href="#categories" data-route="categories">Categories</a>
    </nav>
    <div class="sidefoot" id="foot"></div>
  </aside>
  <main>
    <header class="top">
      <div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1></div>
      <div class="tools">
        <div class="monthnav">
          <button id="prev" aria-label="Previous month">‹</button>
          <span id="mlabel"></span>
          <button id="next" aria-label="Next month">›</button>
        </div>
        <button class="btn primary add-top" data-action="add">+ Add expense</button>
        <button class="btn" id="logout" type="button">Log out</button>
      </div>
    </header>
    <div class="notice" id="notice"></div>
    <div id="view"></div>
  </main>
</div>

<nav class="tabbar" aria-label="Main">
  <a href="#dashboard" data-route="dashboard">Dashboard</a>
  <a href="#expenses" data-route="expenses">Expenses</a>
  <a href="#categories" data-route="categories">Categories</a>
  <button class="addtab" data-action="add">+ Add</button>
</nav>

<div class="overlay" id="modal" hidden>
  <form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="mtitle" novalidate>
    <h2 id="mtitle">Add expense</h2>
    <div class="field"><label for="f-desc">What did you spend on?</label><input type="text" id="f-desc" placeholder="e.g. 2 shirts" maxlength="80" autocomplete="off"></div>
    <div class="field"><label for="f-amt">Amount (₹)</label><input id="f-amt" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
    <div class="field"><label for="f-cat">Category</label><input type="text" id="f-cat" list="catlist" placeholder="Pick one or type a new one" maxlength="30" autocomplete="off"><datalist id="catlist"></datalist></div>
    <div class="field"><label for="f-date">Date</label><input type="date" id="f-date"></div>
    <p class="err" id="ferr" role="alert"></p>
    <div class="btns"><button type="button" class="btn" id="fcancel">Cancel</button><button type="submit" class="btn primary">Save expense</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="authwrap" id="auth" hidden>
  <form class="sheet" id="authform" novalidate>
    <div class="brand"><span class="mark">₹</span><div><b>Kharcha</b><small>Personal finance</small></div></div>
    <h2 id="atitle">Log in</h2>
    <div class="field"><label for="a-user">Username</label><input type="text" id="a-user" autocomplete="username" autocapitalize="none" maxlength="30"></div>
    <div class="field"><label for="a-pass">Password</label><input type="password" id="a-pass" autocomplete="current-password" maxlength="64"></div>
    <div class="field" id="a-pass2-wrap" hidden><label for="a-pass2">Confirm password</label><input type="password" id="a-pass2" autocomplete="new-password" maxlength="64"></div>
    <p class="err" id="aerr" role="alert"></p>
    <button type="submit" class="btn primary" id="asubmit" style="width:100%">Log in</button>
    <button type="button" class="swap" id="aswap">New here? Create an account</button>
    <p class="fine">Accounts and expenses are saved in this browser only. If you forget the password, it cannot be recovered.</p>
  </form>
</div>

<script>
(function(){
var DEFAULT_CATS=['Food','Clothes','Travel','Bills','Shopping','Health','Other'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var ROUTES=['dashboard','expenses','categories'];
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var inr=function(n,d){d=d==null?2:d;return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d})};
var compact=function(n){if(n>=100000)return '₹'+(n/100000).toFixed(1).replace(/\.0$/,'')+'L';if(n>=1000)return '₹'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k';return '₹'+Math.round(n)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var keyOf=function(y,m){return y+'-'+pad(m+1)};
var dim=function(y,m){return new Date(y,m+1,0).getDate()};
var prevOf=function(c){return c.m===0?{y:c.y-1,m:11}:{y:c.y,m:c.m-1}};
var ordinal=function(d){var s=['th','st','nd','rd'],v=d%100;return d+(s[(v-20)%10]||s[v]||s[0])};

var today=new Date();
var cur={y:today.getFullYear(),m:today.getMonth()};
var expenses=[],customCats=[],loaded=true,mode='local',route='dashboard',q='',chartData=null;
var dbRefs=null,gotFirst=false,loadNote='',user=null;

/* ---------- storage: private account store when available, else this browser ---------- */
var LS_KEY=null;
function lsLoad(){try{var r=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(r){expenses=r.expenses||[];customCats=r.cats||[];}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({expenses:expenses,cats:customCats}))}catch(e){}}
function initDb(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return null;
    return user.id().then(function(uid){
      if(!uid)return;
      var col=db.doc('data/users/'+uid+'/ledger').collection('expenses');
      var settings=db.doc('data/users/'+uid+'/settings');
      dbRefs={col:col,settings:settings};mode='db';loaded=false;expenses=[];customCats=[];
      loadNote='Loading your saved expenses…';render();
      var t=setTimeout(function(){if(!gotFirst){loadNote='Your saved expenses are taking a while to load.';render();}},10000);
      col.onSnapshot(function(snap){
        expenses=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
        loaded=true;if(!snap.metadata.fromCache){gotFirst=true;loadNote='';clearTimeout(t);}
        render();
      },function(){loaded=true;loadNote="Couldn't load your saved expenses.";render();});
      settings.onSnapshot(function(s){customCats=s.exists&&s.data().cats?s.data().cats:[];render();},function(){});
    });
  }).catch(function(){});
}
function saveExpense(e){
  if(mode==='db'){return dbRefs.col.doc().set(e);}
  e.id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  expenses.push(e);lsSave();render();return Promise.resolve();
}
function removeExpense(id){
  if(mode==='db'){return dbRefs.col.doc(id).delete();}
  expenses=expenses.filter(function(e){return e.id!==id});lsSave();render();return Promise.resolve();
}
function saveCats(){
  if(mode==='db'){return dbRefs.settings.set({cats:customCats});}
  lsSave();render();return Promise.resolve();
}

function isSample(){return false}
function getSrc(){return expenses}

/* ---------- helpers ---------- */
function inMonth(src,key){return src.filter(function(e){return e.date.slice(0,7)===key})}
function stats(src,key){var rows=inMonth(src,key),total=0,by={};rows.forEach(function(e){total+=e.amount;by[e.cat]=(by[e.cat]||0)+e.amount});return {rows:rows,total:total,by:by}}
function sorted(rows){return rows.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0)})}
function allCats(src){var seen={},out=[];DEFAULT_CATS.concat(customCats,src.map(function(e){return e.cat})).forEach(function(c){var k=String(c).toLowerCase();if(!seen[k]){seen[k]=1;out.push(c)}});return out}
function fmtDate(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function rowHtml(e,del){return '<li class="row"><div class="rmain"><span class="rdesc">'+esc(e.desc)+'</span><span class="rmeta">'+esc(e.cat)+' · '+fmtDate(e.date)+'</span></div><span class="ramt">'+inr(e.amount)+'</span>'+(del&&!e.sample?'<button class="del" data-action="del" data-id="'+esc(e.id)+'" aria-label="Delete '+esc(e.desc)+'">✕</button>':'<span></span>')+'</li>'}
function cumSeries(rows,upto,dmax){var per=[];for(var i=0;i<=dmax;i++)per.push(0);rows.forEach(function(e){per[+e.date.slice(8,10)]+=e.amount});var out=[],s=0;for(var d=1;d<=dmax;d++){s+=per[d];out.push(d<=upto?s:null)}return out}
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

/* ---------- views ---------- */
function viewDashboard(src){
  var key=keyOf(cur.y,cur.m),pk=prevOf(cur),pkey=keyOf(pk.y,pk.m);
  var s=stats(src,key),p=stats(src,pkey);
  var isCur=cur.y===today.getFullYear()&&cur.m===today.getMonth();
  var cutoff=isCur?today.getDate():31;
  var pCut=p.rows.filter(function(e){return +e.date.slice(8,10)<=cutoff}).reduce(function(a,e){return a+e.amount},0);
  var cn=MONTHS[cur.m],pn=MONTHS[pk.m],diff=s.total-pCut,cmp;
  if(p.total===0){cmp='<p>No expenses recorded in '+pn+' to compare with yet.</p>'}
  else{
    var pct=pCut>0?Math.round(Math.abs(diff)/pCut*100):null;
    var pill=diff>0?'<span class="pill up">▲ '+inr(diff,0)+' more'+(pct!=null?' (+'+pct+'%)':'')+'</span>':diff<0?'<span class="pill down">▼ '+inr(-diff,0)+' less'+(pct!=null?' (−'+pct+'%)':'')+'</span>':'<span class="pill flat">Same as '+pn+'</span>';
    var line=isCur?'By the '+ordinal(cutoff)+' of '+pn+' you had spent '+inr(pCut,0)+'. The full month came to '+inr(p.total,0)+'.':cn+' came to '+inr(s.total,0)+' against '+inr(p.total,0)+' in '+pn+'.';
    cmp=pill+'<p>'+line+'</p>';
  }
  var dA=dim(cur.y,cur.m),dB=dim(pk.y,pk.m),dmax=Math.max(dA,dB);
  chartData={a:cumSeries(s.rows,isCur?today.getDate():dA,dmax),b:cumSeries(p.rows,dB,dmax),dmax:dmax};
  var cats=Object.keys(s.by).concat(Object.keys(p.by).filter(function(c){return !(c in s.by)}));
  cats.sort(function(x,y){return (s.by[y]||0)-(s.by[x]||0)||(p.by[y]||0)-(p.by[x]||0)});
  var mx=1;cats.forEach(function(c){mx=Math.max(mx,s.by[c]||0,p.by[c]||0)});
  var crows=cats.map(function(c){
    var a=s.by[c]||0,b=p.by[c]||0,share=s.total?(a/s.total*100).toFixed(1):'0.0';
    return '<div class="crow"><div class="cname">'+esc(c)+'<span>'+share+'% of '+cn+'</span></div><div class="camt">'+inr(a,0)+'<span>'+pn+' '+inr(b,0)+'</span></div><div class="cbars"><div class="bar'+(a?'':' zero')+'" style="width:'+(a?Math.max(1.5,a/mx*100):0.5)+'%"></div><div class="bar p'+(b?'':' zero')+'" style="width:'+(b?Math.max(1.5,b/mx*100):0.5)+'%"></div></div></div>';
  }).join('');
  var recent=sorted(s.rows).slice(0,5).map(function(e){return rowHtml(e,false)}).join('');
  return '<div class="grid g-top">'
   +'<section class="card"><p class="label">Total this month</p><p class="big">'+inr(s.total)+'</p><p class="sub">'+cn+' '+cur.y+'</p><div class="cmp">'+cmp+'</div></section>'
   +'<section class="card count"><p class="label">Transactions</p><p class="big">'+s.rows.length+'</p><p class="sub">Expenses recorded</p></section>'
   +'</div>'
   +'<section class="card" style="margin-top:16px"><div class="head"><div><h2>'+cn+' vs '+pn+'</h2><p class="hint">Total spent so far, day by day</p></div></div>'
   +'<p class="legend"><span><i></i>'+cn+' <b>'+inr(s.total,0)+'</b></span><span><i class="p"></i>'+pn+' <b>'+inr(p.total,0)+'</b></span></p>'
   +'<div id="linechart" role="img" aria-label="Cumulative spending in '+cn+' compared with '+pn+'"></div></section>'
   +'<div class="grid" style="margin-top:16px"><section class="card"><div class="head"><div><h2>Category breakdown</h2><p class="hint">Thick bar is '+cn+', thin bar is '+pn+'</p></div></div>'+(crows||'<p class="empty">No spending in '+cn+' or '+pn+'.</p>')+'</section>'
   +'<section class="card"><div class="head"><h2>Recent expenses</h2><a class="link" href="#expenses">View all →</a></div>'+(recent?'<ul class="list">'+recent+'</ul>':'<p class="empty">Nothing recorded in '+cn+' yet.</p>')+'</section></div>';
}
function expListHtml(){
  var key=keyOf(cur.y,cur.m),rows=sorted(inMonth(getSrc(),key)),t=q.trim().toLowerCase();
  if(t)rows=rows.filter(function(e){return e.desc.toLowerCase().indexOf(t)>-1||e.cat.toLowerCase().indexOf(t)>-1});
  return rows.length?rows.map(function(e){return rowHtml(e,true)}).join(''):'<li class="empty">'+(t?'No expenses match “'+esc(q)+'”.':'Nothing recorded in '+MONTHS[cur.m]+' yet.')+'</li>';
}
function viewExpenses(src){
  var s=stats(src,keyOf(cur.y,cur.m));
  return '<section class="card"><div class="head"><div><h2>'+MONTHS[cur.m]+' '+cur.y+'</h2><p class="hint">'+s.rows.length+' expenses · '+inr(s.total)+'</p></div></div>'
   +'<div class="field"><label for="q">Search by name or category</label><input type="search" id="q" value="'+esc(q)+'" placeholder="Search"></div>'
   +'<ul class="list" id="elist">'+expListHtml()+'</ul></section>';
}
function viewCategories(src){
  var s=stats(src,keyOf(cur.y,cur.m)),cats=allCats(src);
  cats.sort(function(a,b){return (s.by[b]||0)-(s.by[a]||0)});
  var counts={};s.rows.forEach(function(e){counts[e.cat]=(counts[e.cat]||0)+1});
  var rows=cats.map(function(c){var a=s.by[c]||0;
    return '<div class="crow"><div class="cname">'+esc(c)+'<span>'+(counts[c]||0)+' expenses</span></div><div class="camt">'+inr(a)+'<span>'+(s.total?(a/s.total*100).toFixed(1):'0.0')+'%</span></div><div class="cbars"><div class="bar'+(a?'':' zero')+'" style="width:'+(s.total&&a?Math.max(1.5,a/s.total*100):0.5)+'%"></div></div></div>'}).join('');
  return '<section class="card"><div class="head"><div><h2>Categories</h2><p class="hint">Spending in '+MONTHS[cur.m]+' '+cur.y+'</p></div></div>'+rows
   +'<form id="catform" class="inline" novalidate><label class="label" for="newcat" style="flex-basis:100%">Add a category</label><input type="text" id="newcat" placeholder="e.g. Recharge" maxlength="30" autocomplete="off"><button class="btn primary" type="submit">Add category</button></form><p class="err" id="caterr" role="alert"></p></section>';
}

/* ---------- chart ---------- */
function drawLine(){
  var el=$('#linechart');if(!el||!chartData)return;
  var W=el.clientWidth;if(!W)return;
  var H=Math.max(190,Math.min(260,Math.round(W*0.42))),m={l:46,r:16,t:12,b:26};
  var a=chartData.a,b=chartData.b,dmax=chartData.dmax,maxV=1;
  a.concat(b).forEach(function(v){if(v!=null&&v>maxV)maxV=v});
  var step=niceStep(maxV/4),top=Math.ceil(maxV/step)*step;
  var x=function(d){return m.l+(dmax>1?(d-1)/(dmax-1):0)*(W-m.l-m.r)};
  var y=function(v){return H-m.b-v/top*(H-m.t-m.b)};
  var g='',k;
  for(k=0;k<=top/step+0.001;k++){var v=k*step;g+='<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tk" x="'+(m.l-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+compact(v)+'</text>'}
  [1,5,10,15,20,25,30].forEach(function(d){if(d<=dmax)g+='<text class="tk" x="'+x(d)+'" y="'+(H-8)+'" text-anchor="middle">'+d+'</text>'});
  function path(arr){var s='',started=false;arr.forEach(function(v,i){if(v==null)return;s+=(started?'L':'M')+x(i+1).toFixed(1)+' '+y(v).toFixed(1)+' ';started=true});return s}
  function last(arr){for(var i=arr.length-1;i>=0;i--)if(arr[i]!=null)return i;return -1}
  var la=last(a),lb=last(b),area='';
  if(la>=0){area='<path d="'+path(a)+'L'+x(la+1).toFixed(1)+' '+y(0)+' L'+x(1).toFixed(1)+' '+y(0)+' Z" fill="var(--accent)" fill-opacity="0.1" stroke="none"/>'}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true">'+g
   +'<path d="'+path(b)+'" fill="none" stroke="var(--prev)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>'
   +(lb>=0?'<circle cx="'+x(lb+1)+'" cy="'+y(b[lb])+'" r="3.5" fill="var(--prev)"/>':'')
   +area+'<path d="'+path(a)+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
   +(la>=0?'<circle cx="'+x(la+1)+'" cy="'+y(a[la])+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>':'')
   +'</svg>';
  el.innerHTML=svg;
}

/* ---------- render ---------- */
function render(){
  var src=getSrc(),sample=isSample();
  document.querySelectorAll('[data-route]').forEach(function(a){if(a.dataset.route===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var T={dashboard:['Your finances at a glance','Dashboard'],expenses:['Everything you spent','Expenses'],categories:['Where the money goes','Categories']}[route];
  $('#eyebrow').textContent=T[0];$('#title').textContent=T[1];
  $('#mlabel').textContent=MONTHS[cur.m]+' '+cur.y;
  $('#next').disabled=cur.y*12+cur.m>=today.getFullYear()*12+today.getMonth();
  var n=$('#notice');
  if(loadNote)n.innerHTML='<span>'+esc(loadNote)+'</span>';
  else if(loaded&&expenses.length===0)n.innerHTML='<span>No expenses yet. Add your first one to get started.</span><button data-action="add">Add expense</button>';
  else n.innerHTML='';
  var active=document.activeElement&&document.activeElement.id;
  $('#view').innerHTML=({dashboard:viewDashboard,expenses:viewExpenses,categories:viewCategories})[route](src);
  if(route==='dashboard')drawLine();
  if(active==='q'||active==='newcat'){var f=document.getElementById(active);if(f){f.focus();var l=f.value.length;try{f.setSelectionRange(l,l)}catch(e){}}}
  $('#foot').textContent=(user?'Signed in as '+user+'. ':'')+'Saved in this browser only.';
}

/* ---------- add expense ---------- */
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(function(){t.textContent=''},2600)}
function openModal(){
  var src=getSrc();
  $('#catlist').innerHTML=allCats(isSample()?[]:src).map(function(c){return '<option value="'+esc(c)+'">'}).join('');
  $('#f-desc').value='';$('#f-amt').value='';$('#f-cat').value='';
  var d=new Date();if(cur.y!==d.getFullYear()||cur.m!==d.getMonth())d=new Date(cur.y,cur.m,1);
  $('#f-date').value=ymd(d);$('#f-date').max=ymd(new Date(today.getFullYear(),today.getMonth(),today.getDate()));
  $('#ferr').textContent='';$('#modal').hidden=false;setTimeout(function(){$('#f-desc').focus()},0);
}
function closeModal(){$('#modal').hidden=true}
$('#form').addEventListener('submit',function(ev){
  ev.preventDefault();
  var desc=$('#f-desc').value.trim(),amt=Math.round(parseFloat($('#f-amt').value.replace(/,/g,''))*100)/100,cat=$('#f-cat').value.trim(),date=$('#f-date').value;
  var err=!desc?'Enter what you spent on.':!(amt>0)?'Enter an amount greater than 0.':!cat?'Choose or type a category.':!/^\d{4}-\d{2}-\d{2}$/.test(date)?'Pick a date.':'';
  if(err){$('#ferr').textContent=err;return}
  var existing=allCats(isSample()?[]:expenses).filter(function(c){return c.toLowerCase()===cat.toLowerCase()})[0];
  cat=existing||cat;
  var e={desc:desc,amount:amt,cat:cat,date:date,ts:Date.now()};
  saveExpense(e).then(function(){
    cur={y:+date.slice(0,4),m:+date.slice(5,7)-1};closeModal();toast('Expense added');render();
  }).catch(function(){$('#ferr').textContent="Couldn't save. This page may be open in view-only mode."});
});
$('#fcancel').addEventListener('click',closeModal);
$('#modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]');if(!t)return;
  var a=t.dataset.action;
  if(a==='add'){openModal()}
  else if(a==='del'){
    if(t.classList.contains('armed')){removeExpense(t.dataset.id).then(function(){toast('Expense deleted')}).catch(function(){toast("Couldn't delete")});}
    else{t.classList.add('armed');t.textContent='Delete?';setTimeout(function(){if(t.isConnected){t.classList.remove('armed');t.textContent='✕'}},3000)}
  }
});
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;$('#elist').innerHTML=expListHtml()}});
document.addEventListener('submit',function(e){
  if(e.target.id!=='catform')return;e.preventDefault();
  var v=$('#newcat').value.trim(),er=$('#caterr');
  if(!v){er.textContent='Type a category name.';return}
  if(allCats(isSample()?[]:expenses).some(function(c){return c.toLowerCase()===v.toLowerCase()})){er.textContent='That category already exists.';return}
  customCats.push(v);saveCats().then(function(){toast('Category added');render()}).catch(function(){customCats.pop();er.textContent="Couldn't save the category."});
});
$('#prev').addEventListener('click',function(){cur=prevOf(cur);render()});
$('#next').addEventListener('click',function(){cur=cur.m===11?{y:cur.y+1,m:0}:{y:cur.y,m:cur.m+1};render()});
function readRoute(){var h=location.hash.slice(1);route=ROUTES.indexOf(h)>-1?h:'dashboard'}
window.addEventListener('hashchange',function(){readRoute();render()});
var rT;window.addEventListener('resize',function(){clearTimeout(rT);rT=setTimeout(drawLine,100)});


/* ---------- sign up / log in (stored in this browser, password hashed with PBKDF2) ---------- */
var USERS_KEY='kharcha.users',SESSION_KEY='kharcha.session',signup=false;
function getUsers(){try{return JSON.parse(localStorage.getItem(USERS_KEY)||'{}')||{}}catch(e){return {}}}
function putUsers(u){try{localStorage.setItem(USERS_KEY,JSON.stringify(u));return true}catch(e){return false}}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function hashPw(pw,salt){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,256)}).then(b64);
}
function setMode(isSignup){
  signup=isSignup;
  $('#atitle').textContent=isSignup?'Create account':'Log in';
  $('#asubmit').textContent=isSignup?'Sign up':'Log in';
  $('#aswap').textContent=isSignup?'Already have an account? Log in':'New here? Create an account';
  $('#a-pass2-wrap').hidden=!isSignup;
  $('#a-pass').autocomplete=isSignup?'new-password':'current-password';
  $('#aerr').textContent='';
}
function showAuth(){
  $('#auth').hidden=false;document.querySelector('.shell').hidden=true;document.querySelector('.tabbar').hidden=true;
  $('#a-user').value='';$('#a-pass').value='';$('#a-pass2').value='';
  setMode(Object.keys(getUsers()).length===0);
  setTimeout(function(){$('#a-user').focus()},0);
}
function startSession(name){
  user=name;LS_KEY='kharcha.data.'+name;expenses=[];customCats=[];q='';lsLoad();
  try{localStorage.setItem(SESSION_KEY,name)}catch(e){}
  $('#auth').hidden=true;document.querySelector('.shell').hidden=false;document.querySelector('.tabbar').hidden=false;
  cur={y:today.getFullYear(),m:today.getMonth()};render();
}
function logout(){
  try{localStorage.removeItem(SESSION_KEY)}catch(e){}
  user=null;LS_KEY=null;expenses=[];customCats=[];closeModal();showAuth();
}
$('#aswap').addEventListener('click',function(){setMode(!signup)});
$('#logout').addEventListener('click',logout);
$('#authform').addEventListener('submit',function(ev){
  ev.preventDefault();
  var name=$('#a-user').value.trim().toLowerCase(),pw=$('#a-pass').value,pw2=$('#a-pass2').value,er=$('#aerr');
  if(!window.crypto||!crypto.subtle){er.textContent='This browser cannot create secure logins. Open the page over https or in Chrome.';return}
  if(!/^[a-z0-9_.-]{3,30}$/.test(name)){er.textContent='Username must be 3 to 30 letters, numbers, dots, dashes or underscores.';return}
  if(pw.length<6){er.textContent='Password must be at least 6 characters.';return}
  var users=getUsers(),btn=$('#asubmit');btn.disabled=true;er.textContent='';
  if(signup){
    if(users[name]){er.textContent='That username is taken. Choose another or log in.';btn.disabled=false;return}
    if(pw!==pw2){er.textContent='Passwords do not match.';btn.disabled=false;return}
    var salt=crypto.getRandomValues(new Uint8Array(16));
    hashPw(pw,salt).then(function(h){
      var first=Object.keys(users).length===0;
      users[name]={salt:b64(salt),hash:h};
      if(!putUsers(users)){er.textContent="Couldn't save the account. Browser storage may be blocked.";return}
      if(first){try{var old=localStorage.getItem('kharcha.v1');if(old&&!localStorage.getItem('kharcha.data.'+name))localStorage.setItem('kharcha.data.'+name,old)}catch(e){}}
      startSession(name);
    }).catch(function(){er.textContent='Something went wrong. Try again.'}).then(function(){btn.disabled=false});
  }else{
    var u=users[name];
    if(!u){er.textContent='No account with that username. Create one first.';btn.disabled=false;return}
    hashPw(pw,unb64(u.salt)).then(function(h){
      if(h!==u.hash){er.textContent='Wrong password.';return}
      startSession(name);
    }).catch(function(){er.textContent='Something went wrong. Try again.'}).then(function(){btn.disabled=false});
  }
});
function boot(){
  var s=null;try{s=localStorage.getItem(SESSION_KEY)}catch(e){}
  if(s&&getUsers()[s])startSession(s);else showAuth();
}
readRoute();boot();

})();
